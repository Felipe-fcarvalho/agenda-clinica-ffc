name: CI

on: 
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABAS_URL: postgresql://agenda:agenda@localhost:5431/agenda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: 
          node-version: 24
          cache: npm
      - run: npm ci 
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build